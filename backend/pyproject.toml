[project]
name = "spendguard"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.7.0",
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
